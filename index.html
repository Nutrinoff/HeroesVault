<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heroes Vault - HotS Builds & Database</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #141923;
      --card-border: #1f2838;
      --accent-blue: #00d2ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
    }

    .container { max-width: 1200px; margin: 0 auto; }
    
    /* Header / Navbar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--accent-blue);
    }

    /* Main App Layout with Sidebar */
    .app-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .app-layout { grid-template-columns: 1fr; }
    }

    /* Sidebar list */
    .sidebar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      height: fit-content;
    }

    .sidebar h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .hero-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 500px;
      overflow-y: auto;
    }

    .hero-item {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .hero-item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .hero-item.active {
      background: rgba(0, 210, 255, 0.1);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    /* Content Area */
    .content-area {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .controls-bar {
      display: flex;
      gap: 16px;
    }

    select {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      flex-grow: 1;
    }

    /* Clean Hero Build Panel */
    .hero-banner {
      background: linear-gradient(135deg, #141923 0%, #1e293b 100%);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
    }

    .hero-title-area {
      margin-bottom: 16px;
    }

    .hero-name {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
    }

    .build-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* The Single Horizontal Line of Talents */
    .build-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    .build-talent-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px;
      width: 84px;
      flex-shrink: 0;
      text-align: center;
    }

    .build-talent-img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background-color: #2a3447;
      border: 1px solid var(--card-border);
      margin-bottom: 6px;
    }

    .build-talent-level {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .build-notes {
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 16px;
      border-radius: 6px;
      border-left: 3px solid var(--accent-blue);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header / Logo & Menu Bar -->
    <header>
      <a href="#" class="logo">⚡ Heroes Vault</a>
      <nav class="nav-links">
        <a href="#">Builds</a>
        <a href="#">Database</a>
        <a href="#">Tier List</a>
      </nav>
    </header>

    <!-- App Layout: Sidebar on Left, Content on Right -->
    <div class="app-layout">
      
      <!-- Left Sidebar: Heroes List -->
      <aside class="sidebar">
        <h3>Heroes</h3>
        <div id="heroList" class="hero-list">
          <!-- Populated dynamically -->
        </div>
      </aside>

      <!-- Right Content Area -->
      <main class="content-area">
        <div class="controls-bar">
          <select id="buildSelect"></select>
        </div>

        <!-- Clean Hero Banner & Horizontal Build Strip -->
        <div class="hero-banner">
          <div class="hero-title-area">
            <div id="heroNameDisplay" class="hero-name">Select a Hero</div>
            <div id="buildNameDisplay" class="build-label">BUILD: -</div>
          </div>
          
          <div id="buildStrip" class="build-strip">
            <!-- Rendered single-line horizontal talent icons -->
          </div>

          <div id="buildNotes" class="build-notes">
            Select a build to view details and strategy notes.
          </div>
        </div>
      </main>

    </div>
  </div>

  <script>
    let heroesData = [];
    let buildsData = [];
    let currentHeroId = null;

    const CDN_BASE = "https://raw.githubusercontent.com/HeroesToolChest/heroes-images/main/heroesimages/talents/";

    async function initApp() {
      try {
        const [heroesRes, buildsRes] = await Promise.all([
          fetch('data/heroes.json'),
          fetch('data/builds.json')
        ]);

        heroesData = await heroesRes.json();
        buildsData = await buildsRes.json();

        if (heroesData.length > 0) {
          currentHeroId = heroesData[0].id;
        }

        renderSidebar();
        loadSelectedHero();
      } catch (err) {
        console.error("Failed to load JSON data:", err);
      }
    }

    function renderSidebar() {
      const listEl = document.getElementById('heroList');
      listEl.innerHTML = heroesData.map(h => `
        <button class="hero-item ${h.id === currentHeroId ? 'active' : ''}" onclick="selectHero('${h.id}')">
          ${h.name}
        </button>
      `).join('');
    }

    function selectHero(heroId) {
      currentHeroId = heroId;
      renderSidebar();
      loadSelectedHero();
    }

    function loadSelectedHero() {
      const hero = heroesData.find(h => h.id === currentHeroId);
      const heroBuilds = buildsData.find(b => b.heroId === currentHeroId);

      document.getElementById('heroNameDisplay').textContent = hero ? hero.name : 'Unknown';

      populateBuildDropdown(heroBuilds ? heroBuilds.builds : [], hero);
    }

    function populateBuildDropdown(builds, hero) {
      const buildSelect = document.getElementById('buildSelect');
      if (!builds || builds.length === 0) {
        buildSelect.innerHTML = '<option>No builds available</option>';
        renderBuildStrip(null, hero);
        return;
      }

      buildSelect.innerHTML = builds.map(b => `<option value="${b.buildCode}">${b.buildName}</option>`).join('');
      buildSelect.onchange = () => updateActiveBuild(builds, hero);
      
      updateActiveBuild(builds, hero);
    }

    function updateActiveBuild(builds, hero) {
      const buildSelect = document.getElementById('buildSelect');
      const selectedIndex = buildSelect.selectedIndex;
      const currentBuild = builds[selectedIndex];

      if (!currentBuild) return;

      document.getElementById('buildNameDisplay').textContent = `BUILD: ${currentBuild.buildName}`;
      document.getElementById('buildNotes').innerHTML = currentBuild.notes || 'No strategy notes provided.';

      renderBuildStrip(currentBuild.buildCode, hero);
    }

    function renderBuildStrip(buildCode, hero) {
      const stripEl = document.getElementById('buildStrip');
      stripEl.innerHTML = '';

      const tiers = [1, 4, 7, 10, 13, 16, 20];
      let indices = [1, 1, 1, 1, 1, 1, 1]; // defaults

      if (buildCode && buildCode.startsWith('[T')) {
        const matches = buildCode.match(/\[T(\d+),/);
        if (matches) {
          indices = matches[1].split('').map(Number);
        }
      }

      tiers.forEach((level, idx) => {
        const tierTalents = hero && hero.talents && hero.talents[level] ? hero.talents[level] : [];
        const choiceIndex = indices[idx] ? indices[idx] - 1 : 0;
        const chosenTalent = tierTalents[choiceIndex] || { name: 'Unknown', icon: '' };

        const item = document.createElement('div');
        item.className = 'build-talent-item';
        item.innerHTML = `
          <img class="build-talent-img" src="${getIconUrl(chosenTalent.icon)}" alt="${chosenTalent.name}" title="${chosenTalent.name}: ${chosenTalent.description || ''}" onerror="this.src='https://via.placeholder.com/48/141923/94a3b8?text=?'">
          <span class="build-talent-level">Level ${level}</span>
        `;
        stripEl.appendChild(item);
      });
    }

    function getIconUrl(iconPath) {
      if (!iconPath) return '';
      if (iconPath.startsWith('http')) return iconPath;
      return `${CDN_BASE}${iconPath.replace(/^\//, '')}`;
    }

    initApp();
  </script>
</body>
</html>
