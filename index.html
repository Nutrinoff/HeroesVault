<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heroes Vault - HotS Builds & Database</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #141923;
      --card-border: #1f2838;
      --accent-blue: #00d2ff;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
    }

    .container { max-width: 1200px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .controls-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    select {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Hero Banner & Horizontal Build Strip */
    .hero-banner {
      background: linear-gradient(135deg, #141923 0%, #1e293b 100%);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .hero-title-area {
      margin-bottom: 20px;
    }

    .hero-name {
      font-size: 36px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .build-label {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .build-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .build-talent-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px;
      width: 80px;
      flex-shrink: 0;
      text-align: center;
    }

    .build-talent-img {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      object-fit: cover;
      background-color: #2a3447;
      border: 1px solid var(--card-border);
      margin-bottom: 6px;
    }

    .build-talent-level {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Notes section */
    .build-notes {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Heroes Vault</h1>
    </header>

    <div class="controls-bar">
      <select id="heroSelect"></select>
      <select id="buildSelect"></select>
    </div>

    <div class="hero-banner">
      <div class="hero-title-area">
        <div id="heroNameDisplay" class="hero-name">Hero Name</div>
        <div id="buildNameDisplay" class="build-label">BUILD: Select a build</div>
      </div>
      <div id="buildStrip" class="build-strip">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <div id="buildNotes" class="build-notes">
      Select a build to view strategic notes.
    </div>
  </div>

  <script>
    let heroesData = [];
    let buildsData = [];

    const CDN_BASE = "https://raw.githubusercontent.com/HeroesToolChest/heroes-images/main/heroesimages/talents/";

    async function initApp() {
      try {
        const [heroesRes, buildsRes] = await Promise.all([
          fetch('data/heroes.json'),
          fetch('data/builds.json')
        ]);

        heroesData = await heroesRes.json();
        buildsData = await buildsRes.json();

        populateHeroDropdown();
        loadSelectedHero();
      } catch (err) {
        console.error("Failed to load JSON data:", err);
      }
    }

    function populateHeroDropdown() {
      const heroSelect = document.getElementById('heroSelect');
      heroSelect.innerHTML = heroesData.map(h => `<option value="${h.id}">${h.name}</option>`).join('');
      heroSelect.addEventListener('change', loadSelectedHero);
    }

    function loadSelectedHero() {
      const selectedId = document.getElementById('heroSelect').value;
      const hero = heroesData.find(h => h.id === selectedId);
      const heroBuilds = buildsData.find(b => b.heroId === selectedId);

      document.getElementById('heroNameDisplay').textContent = hero ? hero.name : 'Unknown';

      populateBuildDropdown(heroBuilds ? heroBuilds.builds : [], hero);
    }

    function populateBuildDropdown(builds, hero) {
      const buildSelect = document.getElementById('buildSelect');
      if (!builds || builds.length === 0) {
        buildSelect.innerHTML = '<option>No builds available</option>';
        renderBuildStrip(null, hero);
        return;
      }

      buildSelect.innerHTML = builds.map(b => `<option value="${b.buildCode}" data-notes="${b.notes || ''}">${b.buildName}</option>`).join('');
      buildSelect.onchange = () => updateActiveBuild(builds, hero);
      
      updateActiveBuild(builds, hero);
    }

    function updateActiveBuild(builds, hero) {
      const buildSelect = document.getElementById('buildSelect');
      const selectedIndex = buildSelect.selectedIndex;
      const currentBuild = builds[selectedIndex];

      if (!currentBuild) return;

      document.getElementById('buildNameDisplay').textContent = `BUILD: ${currentBuild.buildName}`;
      document.getElementById('buildNotes').innerHTML = currentBuild.notes || 'No notes provided.';

      renderBuildStrip(currentBuild.buildCode, hero);
    }

    function renderBuildStrip(buildCode, hero) {
      const stripEl = document.getElementById('buildStrip');
      stripEl.innerHTML = '';

      const tiers = [1, 4, 7, 10, 13, 16, 20];
      let indices = [1, 1, 1, 1, 1, 1, 1]; // defaults

      if (buildCode && buildCode.startsWith('[T')) {
        const matches = buildCode.match(/\[T(\d+),/);
        if (matches) {
          indices = matches[1].split('').map(Number);
        }
      }

      tiers.forEach((level, idx) => {
        const tierTalents = hero && hero.talents && hero.talents[level] ? hero.talents[level] : [];
        const choiceIndex = indices[idx] ? indices[idx] - 1 : 0;
        const chosenTalent = tierTalents[choiceIndex] || { name: 'Unknown', icon: '' };

        const item = document.createElement('div');
        item.className = 'build-talent-item';
        item.innerHTML = `
          <img class="build-talent-img" src="${getIconUrl(chosenTalent.icon)}" alt="${chosenTalent.name}" title="${chosenTalent.name}: ${chosenTalent.description || ''}" onerror="this.src='https://via.placeholder.com/48/141923/94a3b8?text=?'">
          <span class="build-talent-level">Level ${level}</span>
        `;
        stripEl.appendChild(item);
      });
    }

    function getIconUrl(iconPath) {
      if (!iconPath) return '';
      if (iconPath.startsWith('http')) return iconPath;
      return `${CDN_BASE}${iconPath.replace(/^\//, '')}`;
    }

    initApp();
  </script>
</body>
</html>
