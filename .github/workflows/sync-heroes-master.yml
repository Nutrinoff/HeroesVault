name: Sync Heroes Master Catalog

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync heroes-master.json when version changes
        env:
          API_BASE: https://s-st-01.anteater-bushmaster.ts.net
          TARGET_FILE: data/heroes-master.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TARGET_FILE")"
          mkdir -p .sync-tmp

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            "${API_BASE}/api/catalog/heroes-master" \
            -o .sync-tmp/remote.json

          node -e '
            const fs = require("fs");

            function extractBuildId(filePath) {
              if (!fs.existsSync(filePath)) return null;
              const data = JSON.parse(fs.readFileSync(filePath, "utf8"));
              const heroesVersion = data?.meta?.heroesVersion ?? null;
              const hdpVersion = data?.meta?.hdpVersion ?? null;
              if (!heroesVersion) return null;
              return `${heroesVersion}|${hdpVersion ?? ""}`;
            }

            const remoteParsed = JSON.parse(fs.readFileSync(".sync-tmp/remote.json", "utf8"));
            const remoteVersion = remoteParsed?.meta?.heroesVersion ?? null;
            const remoteHdp = remoteParsed?.meta?.hdpVersion ?? null;

            if (!remoteVersion) {
              throw new Error("Remote payload is missing meta.heroesVersion.");
            }

            const remoteBuildId = `${remoteVersion}|${remoteHdp ?? ""}`;
            const localBuildId = extractBuildId(process.env.TARGET_FILE);

            console.log(`Frontend build ID: ${localBuildId || "(none)"}`);
            console.log(`Backend build ID:  ${remoteBuildId}`);

            if (localBuildId === remoteBuildId) {
              console.log("Build IDs match; skipping download/update.");
              process.exit(0);
            }

            fs.writeFileSync(".sync-tmp/next.json", JSON.stringify(remoteParsed) + "\n", "utf8");
            fs.writeFileSync(".sync-tmp/should_write", "1", "utf8");
          '

          if [ ! -f .sync-tmp/should_write ]; then
            exit 0
          fi

          cp ".sync-tmp/next.json" "$TARGET_FILE"
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: Commit updated catalog
        if: env.CHANGED == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/heroes-master.json
          git commit -m "chore(data): sync heroes-master.json"
          git push
