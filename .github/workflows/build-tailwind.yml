name: Build Tailwind CSS

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app.js"
      - "js/**"
      - "css/app.css"
      - ".github/workflows/build-tailwind.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Tailwind CSS
        run: npx tailwindcss@3 -i ./css/app.css -o ./css/tailwind.css --minify

      - name: Commit updated tailwind.css if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./css/tailwind.css
          if ! git diff --staged --quiet; then
            git commit -m "chore: rebuild tailwind.css"
            git push
          fi
