name: Auto-Update Patch Notes JSON

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 UTC
  workflow_dispatch: # Allows manual trigger from the Actions tab anytime

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run filter script
        run: node scripts/fetch-patches.js

      - name: Commit and push changes if any
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update separated patch notes json files" && git push)
